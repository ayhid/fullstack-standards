name: CI and release

on:
  push:
    branches: [main, stable]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  release:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # tag, release commit, GitHub release
      issues: write        # comment on released issues
      pull-requests: write # comment on released PRs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # semantic-release reads every commit since the last tag
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # No dependency cache in the job that can write to the repo
          # (setup-node's cache-poisoning guidance).
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
